#### general settings
name: train
use_tb_logger: false
model: enhancement_model
distortion: sr
scale: 1
gpu_ids: [2,3,6,7]
seg: false
clip_type: CLIP

#### datasets
datasets:
  train:
    name: ll_dataset
    interval_list: [1]
    random_reverse: false
    border_mode: false

    invention_num: 2
    # your image path
    dataroot_GT: /data2/zhengkaihang/ttt/dataset/LOLv1/Train/target
    dataroot_LQ: /data2/zhengkaihang/ttt/dataset/LOLv1/Train/input

    n_workers: 8  # per GPU
    batch_size: 12
    GT_size: 256   # size you want to crop out as input sample.
    LQ_size: 256
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: ll_dataset
    # your image path
    dataroot_GT: /data2/zhengkaihang/ttt/dataset/LOLv1/Test/target
    dataroot_LQ: /data2/zhengkaihang/ttt/dataset/LOLv1/Test/input

    train_size: [600, 400]

#### network structures
network_G:
  which_model_G: TTTIR
  num_block: [1,1,1,1,1]

#### path
path:
  root: ./
  strict_load: false
#### training settings: learning rate scheme, loss
train:
  lr_G: 0.0003
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 150000
  lr_steps: [30000, 60000, 100000]
  ft_tsa_only: 0
  warmup_iter: -1
  lr_gamma: 0.5
  eta_min: !!float 1e-7
  vgg_loss: true
  pixel_criterion: l1
  pixel_weight: 1.0
  val_freq: !!float 1e3
  manual.resize960x512_seed: 0

#### logger
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1000
